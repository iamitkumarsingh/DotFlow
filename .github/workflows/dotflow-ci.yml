name: DotFlow development checks

on:
  push:
    branches:
      - dotflow/development
  pull_request:
    branches:
      - master
      - dotflow/development

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax validation (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.git/*' -print0)

  phpunit-dotflow:
    name: DotFlow WordPress integration tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, imap, mbstring, zip
          tools: composer, phpunit:9.6
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install test tooling and PHPUnit polyfills
        run: composer install --no-interaction --prefer-dist

      - name: Audit installed Composer dependencies
        run: composer audit --locked

      - name: Install Subversion for WordPress test suite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run DotFlow PHPUnit integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: phpunit --configuration phpunit.xml.dist --filter 'DotFlow_' --verbose
