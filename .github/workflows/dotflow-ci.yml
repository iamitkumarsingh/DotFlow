name: DotFlow development checks

on:
  push:
    branches:
      - dotflow/development
  pull_request:
    branches:
      - master
      - dotflow/development

concurrency:
  group: dotflow-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-syntax:
    name: PHP syntax validation (${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint all PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' \
            -not -path './vendor/*' \
            -not -path './node_modules/*' \
            -not -path './.git/*' -print0)

  phpunit-dotflow:
    name: DotFlow WordPress integration tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2', '8.3']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli, imap, mbstring, zip
          tools: composer, phpunit:9.6
          coverage: none

      - name: Validate Composer manifest
        run: composer validate --no-check-publish

      - name: Install test tooling and PHPUnit polyfills
        run: composer install --no-interaction --prefer-dist

      - name: Audit installed Composer dependencies
        run: composer audit --locked

      - name: Install Subversion for WordPress test suite
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y subversion

      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest

      - name: Run DotFlow PHPUnit integration tests
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: phpunit --configuration phpunit.xml.dist --filter 'DotFlow_' --verbose

  full-phpunit:
    name: Full WordPress PHPUnit suite (PHP 8.2)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli, imap, mbstring, zip
          tools: composer, phpunit:9.6
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install test dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Audit Composer dependencies
        run: composer audit
      - name: Install Subversion
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y subversion
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest
      - name: Run complete PHPUnit suite
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: phpunit --configuration phpunit.xml.dist --verbose

  phpcs-dotflow:
    name: DotFlow WordPress security and coding-standard scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install coding standards
        run: composer install --no-interaction --prefer-dist
      - name: Scan DotFlow additions
        run: vendor/bin/phpcs --standard=.phpcs.xml.dist includes/dotflow tests/phpunit/unit-tests/includes/dotflow

  js-tests:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run JavaScript unit tests
        run: node --test tests/js/*.test.js

  release-package:
    name: Build and verify installable DotFlow ZIP
    runs-on: ubuntu-latest
    needs: [php-syntax, phpunit-dotflow, full-phpunit, phpcs-dotflow, js-tests]
    permissions:
      contents: read
    steps:
      - name: Check out tested release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build WordPress plugin archive from the tested commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=zip --prefix=dotflow/ HEAD > dist/dotflow-0.1.0.zip
          test -s dist/dotflow-0.1.0.zip
          unzip -t dist/dotflow-0.1.0.zip
      - name: Verify installable archive contents
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 dist/dotflow-0.1.0.zip > dist/archive-files.txt
          grep -Fx 'dotflow/groundhogg.php' dist/archive-files.txt
          grep -Fx 'dotflow/README.txt' dist/archive-files.txt
          grep -Fx 'dotflow/LICENSE.txt' dist/archive-files.txt
          ! grep -Eq '^dotflow/(tests|vendor|node_modules|\.github|docs|bin)/' dist/archive-files.txt
          ! grep -Eq '^dotflow/(composer\.json|package\.json|package-lock\.json|phpunit\.xml\.dist)$' dist/archive-files.txt
          sha256sum dist/dotflow-0.1.0.zip | tee dist/dotflow-0.1.0.zip.sha256
      - name: Upload verified plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: dotflow-0.1.0-wordpress-plugin
          path: |
            dist/dotflow-0.1.0.zip
            dist/dotflow-0.1.0.zip.sha256
          if-no-files-found: error
          retention-days: 30
